  # reasoning_parser: qwen3
  # moe_backend: flashinfer_b12x        # REQUIRED for that MoE on Spark, or it falls back to Marlin and runs 2.5x slower
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # Measured-good fallback (Qwen3.6-35B-A3B FP8 — ~53 tok/s, this is the v4.0/v4.2.1 brain):
  # name: qwen36-35b-a3b-fp8
  # hf_repo: Qwen/Qwen3.6-35B-A3B-FP8
  # local_path: /opt/models/qwen36-35b-a3b-fp8
  # served_name: qwen36-35b
  # docker_image: vllm/vllm-openai:cu130-nightly
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
