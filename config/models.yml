# ASR / TTS — WEIGHTS ONLY. NOTHING SERVES THESE TODAY.
# -----------------------------------------------------------------------------
# Read this before assuming ports 8002/8003 are live. 02_download_models.sh
# pulls both checkpoints, and boot_sequence.sh / watchdog.sh will start and
# self-heal containers named asr-server and tts-server — but NO SCRIPT EVER
# CREATES THEM. boot_sequence logs "not found, skipping" and moves on, which is
# why this has been quiet rather than broken.
#
# Speech-to-text is actually delivered a different way: 04_voice_stt.sh installs
# the openai-whisper CLI and points OpenClaw at the binary, which invokes it per
# media file. No server, no port. check_stack.sh probes for that CLI, not for
# 8002. So the section below describes intended serving infrastructure that does
