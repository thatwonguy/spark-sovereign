  # ROLLBACK — tag v4.2.1 is the last release verified on this hardware
  # (~53 tok/s, FP8 MoE). `git checkout v4.2.1` restores the whole stack.
  #
  # Previous brain (Qwen3.6-35B-A3B MoE, NVFP4 — speed never measured):
  # name: qwen36-35b-a3b-nvfp4
  # hf_repo: unsloth/Qwen3.6-35B-A3B-NVFP4
  # local_path: /opt/models/qwen36-35b-a3b-nvfp4
  # served_name: qwen36-35b
