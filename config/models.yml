# -----------------------------------------------------------------------------
# MEMORY MAP (128GB unified — updated 2026-07-22 for NVFP4 swap)
# -----------------------------------------------------------------------------
# Component                  Allocated   Note
# Qwen3.6-35B-A3B NVFP4      ~97.4 GB   0.80 util — weights shrink to ~24GB (was ~35GB FP8);
#                                       remaining KV cache budget grows accordingly (unverified — measure after swap)
# ASR (nemotron-speech)        3.0 GB   always-on
# TTS (magpie_tts)             1.4 GB   always-on
# SearXNG                      0.5 GB   always-on
# NemoClaw + OpenClaw          1.0 GB   always-on
# OS + Docker + vLLM           6.0 GB   always-on
# ─────────────────────────────────────────────────
# TOTAL                      ~109.3 GB   (on 121.69GiB visible to CUDA) — same envelope as FP8 baseline
# HEADROOM                    ~12.4 GB   ✅ comfortable — MoE only activates 3B/token
# NOTE: run `check_stack.sh` / nvidia-smi after the swap to confirm real numbers —
#       this is a projection, not a measurement. Prior FP8 baseline used ~35GB weights
#       + ~58GB KV cache; NVFP4's smaller weight footprint should free extra KV cache
#       headroom, but exact split depends on vLLM's NVFP4 memory accounting.
#
# If/when swapping to OPTION 2 (Qwen3-Coder-Next-80B FP8, see commented block above):
# weights alone are ~80GB. At gpu_memory_utilization 0.70 (~85GB reserved), that leaves
# only ~5GB for KV cache at max_model_len 130000 — tight. Community Spark testing
# confirms it works at ~45 tok/s, but treat as an experiment, not a settled config.
