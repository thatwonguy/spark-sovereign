  # max_num_seqs: 8                    # 35 GiB of KV, so lower than the 27B's 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # enable_prefix_caching: true
  #
  # # MTP heads SHIP in this checkpoint — 4B of them, per the model card. No
  # # external drafter, unlike the 27B where DSpark had to be found and patched.
  # # 3 is the 27B's measured optimum: 5 lost to 3 and 3 beat 2, because
  # # acceptance decays with draft position while rejected tokens still cost
  # # their verification pass. Re-measure here rather than assuming it carries.
  # speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  #
  # # LOOKUP after first launch, and REQUIRED before any roofline number means
  # # anything: bytes ONE TOKEN reads. 512 experts, 10 active, so a pass touches
