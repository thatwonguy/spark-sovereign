# =============================================================================
# MODEL REGISTRY — spark-sovereign
# =============================================================================
# This is the single source of truth for all models in the stack.
# To swap any model:
#   1. Edit the relevant section below
#   2. Re-run the corresponding script (scripts/02_download_models.sh, etc.)
#   3. Restart the affected Docker container
#
# All scripts source this file via `yq` or the helper `config/parse_models.sh`
# =============================================================================

# -----------------------------------------------------------------------------
# BRAIN — daily driver: coding, vision, agentic, reasoning, tool calls
# -----------------------------------------------------------------------------
# STATUS (2026-08-16): measured on the Spark. Median decode 15–17 tok/s
# across three independent runs (14.3–18.5 range), TTFT ~280 ms, VRAM
# ~55 GB at 0.45 util (nvidia-smi confirmed). Full write-up in
# docs/LESSONS.md #16. Rollback path: `git checkout v4.2.1` restores the
# v4.2.1 FP8 MoE baseline (~53 tok/s, no vision).
# -----------------------------------------------------------------------------
brain:
  name: qwen38-27b-nvfp4
  hf_repo: unsloth/Qwen3.8-27B-NVFP4
  # Optional revision pin. Omitted = latest on main at pull time, which is the
  # right default for a fresh drop (first uploads ship broken — that is what the
  # tokenizer-truncation check in 02_download_models.sh exists to catch).
  # 02_download_models.sh records whatever it resolved to in
  # <local_path>/DOWNLOADED_REVISION.txt, so the running weights are always
  # attributable even when this is blank. Set it to that SHA to freeze them.
  # hf_revision: <sha>
  local_path: /opt/models/qwen38-27b-nvfp4
  port: 8000
  # Interface vLLM listens on. 127.0.0.1 is more secure than 0.0.0.0: it serves
  # this box only
  bind_host: 127.0.0.1
  served_name: qwen38-27b             # arbitrary label independent of model weights; if you change it, re-point OpenClaw
  docker_image: vllm/vllm-openai:qwen38-arm64-cu130   # arm64 build — GB10 is an ARM host
  gpu_memory_utilization: 0.45
  max_model_len: 262144
  kv_cache_dtype: fp8
  max_num_seqs: 16
  max_num_batched_tokens: 8192
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  # UNCONFIRMED AT RUNTIME. vLLM is reported to silently disable prefix caching
  # for this model's card parameters even when the flag is accepted on the
  # command line. If that is happening here, every OpenClaw turn reprocesses
  # the entire conversation prefix — the most expensive possible failure in a
  # coding workflow, and completely silent.
  # Measure it (does not restart Brain):  bash scripts/benchmark.sh audit
  enable_prefix_caching: true
  # Attention backend, passed through as VLLM_ATTENTION_BACKEND.
  #
  # BLANK ON PURPOSE = vLLM autoselects, which is what this repo has always
  # done. Left blank because nobody has yet checked what it autoselects here,
  # and pinning a guess is worse than an honest unknown.
  #
  # Why it matters: `kv_cache_dtype: fp8` above is only actually served by some
  # backends. On SM121 (GB10), FlashAttention is reported not to support an FP8
  # KV cache — triton_attn is. If vLLM quietly falls back to BF16 KV, the FP8
  # setting above is a no-op, KV cache entries are twice the size, and NOTHING
  # ERRORS. The ~55 GB measured at 0.45 util does not distinguish the two cases.
  #
  # It also governs how much context actually fits. The default backend is
  # reported to cap usable context near 60K at 0.80 utilisation on this
  # hardware, with FLASHINFER fitting ~170K instead — and that report is at
  # 0.80, while we run 0.45, roughly half the memory budget, against a
  # declared max_model_len of 262144 below. If the KV cache cannot hold that
  # many tokens, the advertised window is a number the server cannot honour,
  # and it fails mid-session rather than at startup.
  #
  # Find out what is actually live and whether the context is reachable:
  #     bash scripts/benchmark.sh audit         # measures both, read-only
  #     bash scripts/benchmark.sh               # sweeps backends and records the winner
  # Candidates to try, re-measuring after each:
  #     attention_backend: TRITON_ATTN   # reported to be required for FP8 KV on SM121
  #     attention_backend: FLASHINFER    # reported to fit far more context
  # FLASHINFER's reported context win is measured WITHOUT an FP8 KV cache, so
  # it trades against kv_cache_dtype below rather than stacking with it. Change
  # one of the two at a time or the result is uninterpretable.
  attention_backend:
  # MTP speculative decoding — heads ship inside the checkpoint, no draft model.
  #
  # MEASURED 2026-08-26, full matrix, 3 runs x 256 tokens each (docs/BENCHMARKS.md):
  #
  #   off      12.04 tok/s              <- the bandwidth roofline, and it is real
  #   mtp2     18.47 tok/s   60.3% acc
  #   mtp3     19.66 tok/s   64.4% acc  <- chosen
  #   mtp5     15.18 tok/s   39.5% acc  <- what shipped in v5.0/v5.1
  #   ngram5   12.46 tok/s              <- only 10 tokens drafted; see below
  #
  # 5 was worse than 3 AND worse than 2. Longer drafts are not monotonically
  # better: acceptance falls off with draft position, and every rejected token
  # still costs its verification pass. vLLM warns about this at startup for
  # this exact model ("will run multiple times of forward on same MTP layer,
  # which may result in lower acceptance rate") — the warning was accurate and
  # went unread for two releases.
  #
  # 3 over 2 is +6.4%, which is above run-to-run noise here but not by a wide
  # margin. If a future change makes acceptance workload-dependent, re-measure
  # both rather than assuming 3 still wins.
  #
  # READ THE NUMBERS AS A RANKING, NOT A THROUGHPUT GUARANTEE. The four figures
  # above were measured back-to-back in one sweep under identical conditions
  # (watchdog stopped, box otherwise idle), which is what makes comparing them
  # fair. Absolute decode moves with acceptance, and acceptance moves with the
  # sampled continuation: re-measuring mtp3 two hours later gave 46.5%
  # acceptance and 17.1 tok/s rather than 64.4% and 19.66.
  #
  # At 3 draft tokens, tokens per forward pass is 1 + 3 x acceptance, so that
  # drop from 64.4% to 46.5% predicts ~16.1 tok/s and 17.1 was observed. The
  # spread is fully explained by acceptance; nothing is broken. Expect roughly
  # 17-20 tok/s in practice, against a 15.2 tok/s baseline and a 12.0 tok/s
  # non-speculative floor.
  #
  # DO NOT read the ngram result as "ngram is bad". It drafted 10 tokens across
  # a whole generation, i.e. it almost never fired, because the default
  # benchmark prompt writes fresh prose — the worst case for prompt-lookup.
  # On agentic coding, where output echoes files already in context, it may win.
  # Test it against a real workload before ruling it out:
  #   PROMPT="$(cat some_real_file.py)\n\nRefactor this." bash scripts/benchmark.sh --only baseline,spec-ngram5 --redo
  #
  # To re-verify:        bash scripts/benchmark.sh audit      (read-only)
  # To compare methods:  bash scripts/benchmark.sh            (restarts Brain)
  # Is a ceiling real?:  bash scripts/benchmark.sh bandwidth  (read-only)
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
  extra_env:
    CUTE_DSL_ARCH: sm_121a
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  limit_mm_per_prompt: '{"image":10}'   # keep space-free: the `serve` entrypoint branch word-splits VLLM_EXTRA_ARGS
  #
  # --- SWAP EXAMPLES ---
  # ROLLBACK — tag v4.2.1 is the last release verified on this hardware
  # (~53 tok/s, FP8 MoE). `git checkout v4.2.1` restores the whole stack.
  #
  # Previous brain (Qwen3.6-35B-A3B MoE, NVFP4 — speed never measured):
  # name: qwen36-35b-a3b-nvfp4
  # hf_repo: unsloth/Qwen3.6-35B-A3B-NVFP4
  # local_path: /opt/models/qwen36-35b-a3b-nvfp4
  # served_name: qwen36-35b
  # docker_image: vllm/vllm-openai:cu130-nightly   # tag not rebuilt since 2026-04-23
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # moe_backend: flashinfer_b12x        # REQUIRED for that MoE on Spark, or it falls back to Marlin and runs 2.5x slower
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # Measured-good fallback (Qwen3.6-35B-A3B FP8 — ~53 tok/s, this is the v4.0/v4.2.1 brain):
  # name: qwen36-35b-a3b-fp8
  # hf_repo: Qwen/Qwen3.6-35B-A3B-FP8
  # local_path: /opt/models/qwen36-35b-a3b-fp8
  # served_name: qwen36-35b
  # docker_image: vllm/vllm-openai:cu130-nightly
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # extra_env:
  #   VLLM_FLASHINFER_MOE_BACKEND: latency    # Required for SM12.1 MoE kernels on Blackwell (FP8 path only)
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # OPTION 2 — Qwen3-Coder-Next-80B-A3B (coding specialist — a TRADE, not an upgrade):
  # 80B total / 3B active, built on Qwen3-Next-80B-A3B-Base. Corrected against
  # the official Qwen model card (huggingface.co/Qwen/Qwen3-Coder-Next) — an
  # earlier version of this note used a third-party 74.2% SWE-bench figure that
  # made it look like a straight win. It isn't. Official numbers:
  #
  #   Benchmark              Coder-Next    Qwen3.6-35B (current)
  #   SWE-Bench Verified        70.6            73.4      <- current model WINS
  #   Terminal-Bench 2.0        36.2            51.5      <- current model WINS BIG
  #   SWE-Bench Pro             44.3             n/a
  #
  # Reported SWE-bench values for this model range 70.6 / 71.3 / 74.2 depending
  # on scaffold. Only compare same-scaffold numbers; 70.6 is Qwen's own.
  #
  # The genuine case for it is what benchmarks measure poorly: it is RL-trained
  # for long-horizon agentic coding — sustained tool use and recovery from failed
  # tool calls. That maps directly onto OpenClaw. Worth it ONLY if agentic coding
  # is overwhelmingly your primary use.
  #
  # What you GIVE UP by switching:
  #   - Vision. Coder-Next is TEXT-ONLY. Do not carry limit_mm_per_prompt over.
  #   - Thinking mode entirely. The card is explicit: "supports only non-thinking
  #     mode and does not generate <think></think> blocks." Leave reasoning_parser
  #     unset — there is no reasoning output to parse. (The launch scripts now
  #     pass --reasoning-parser conditionally, so blank is safe.)
  #   - Context: 256K native, but see memory notes below.
  #   - General (non-coding) chat and reasoning quality — it's a specialist.
  #
  # Use the 4-bit build, NOT FP8. Unsloth's own guidance puts Coder-Next at
  # ~85GB in 8-bit, which would eat the entire GPU budget and leave ~nothing for
  # KV cache — the FP8 config previously listed here would likely fail to boot.
  # The NVFP4 GB10 build is ~46GB and is quantized specifically for Spark.
  # Caveat: an NVIDIA forum thread reports slow perf on RedHatAI's NVFP4 build of
  # this model, so measure before trusting. Values below are a STARTING POINT.
  # ⚠️  NOT a config-only swap end to end: served_name changes below, so after the
  # brain comes up you MUST re-run the OpenClaw config manually on the Spark to
  # point it at the new model ID. Until you do, OpenClaw is aimed at a model ID
  # that no longer exists and will fail to connect even though the brain is
  # healthy. (The active Qwen3.8 config above ALSO changes served_name, so this
  # step is already required for the current swap regardless.)
  # If you'd rather skip the reconfig, set served_name to whatever OpenClaw is
  # already pointed at and it will reconnect untouched.
  # name: qwen3-coder-next-nvfp4
  # hf_repo: saricles/Qwen3-Coder-Next-NVFP4-GB10   # GB10-tuned; ~46GB weights
  # local_path: /opt/models/qwen3-coder-next-nvfp4
  # served_name: qwen3-coder-80b        # CHANGED -> requires manual OpenClaw reconfig (see above)
  # gpu_memory_utilization: 0.80        # ~97GB; ~46GB weights leaves ~51GB KV cache — VERIFY with nvidia-smi
  # max_model_len: 262144               # 256K native; drop to 131072 first if it OOMs
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder       # confirmed same parser family
  # reasoning_parser:                   # INTENTIONALLY BLANK — no thinking mode
  # moe_backend: flashinfer_b12x        # NVFP4 MoE on Spark — the active dense brain does not use this
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # # limit_mm_per_prompt: OMITTED ON PURPOSE — text-only model

# -----------------------------------------------------------------------------
# SGLANG — second engine, for head-to-head comparison. NOT WIRED INTO BOOT.
# -----------------------------------------------------------------------------
# The strongest reported throughput configs for this model on GB10 run SGLang
# with a DFlash2 drafter, not vLLM. Whether that actually holds here is an open
# question, and a comparison that could only launch vLLM would never find out —
# so SGLang is a first-class row in scripts/benchmark.sh's matrix rather than an
# assumption.
#
# UNCOMMENT ONLY docker_image TO ENABLE. Everything else falls back to the
# brain: block above, so the two engines serve the same weights at the same
# port with the same served name — which is what makes the comparison fair.
#
# No image is pinned because none has been verified on this box, and guessing a
# tag costs a 5-minute load to learn nothing. Until one is set, every SGLang
# scenario is recorded as BLOCKED in docs/BENCHMARKS.md — visible as missing
# data rather than silently absent. You need a build for SM121 / arm64.
#
# Only scripts/benchmark.sh reads this.
# boot_sequence.sh, watchdog.sh and the numbered setup scripts do not, and must
# not: watchdog recovery calls start_brain_ad_hoc.sh, which starts vLLM, so a
# crash during an SGLang session silently reverts the engine. Stop the watchdog
# timer for any SGLang work (benchmark.sh does this for you).
#
# sglang:
#   docker_image:                       # REQUIRED — SM121/arm64 build, none verified yet
#   mem_fraction_static: 0.45           # SGLang's name for gpu_memory_utilization
#   quantization: modelopt_fp4          # NVFP4 path; confirm against the build you pin
#   attention_backend: flashinfer       # SGLang's own backend names, not vLLM's
#   tool_call_parser: qwen25
#   reasoning_parser: qwen3
#   disable_radix_cache: false          # radix cache = SGLang's prefix cache, ON by default.
#                                       # Note the inverted sense vs vLLM's enable_prefix_caching.
#   # --- Speculative decoding (the reason SGLang is on the list at all) ---
#   # DFlash2 needs a drafter checkpoint downloaded separately; leave the path
#   # blank and this falls back to whatever the build supports natively.
#   speculative_algorithm:              # e.g. EAGLE / NEXTN — depends on the build
#   speculative_num_steps:
#   speculative_draft_model_path:

