# =============================================================================
# MODEL REGISTRY — spark-sovereign
# =============================================================================
# Single source of truth for every model in the stack. To swap one:
#   1. Edit the relevant section below
#   2. Re-run the matching script (scripts/02_download_models.sh, etc.)
#   3. Restart the affected container (scripts/03_vllm_servers.sh)
#
# Scripts read this with python3 + PyYAML, not yq — see get_model_field() in
# 02_download_models.sh. Nothing needs to be installed to parse it.
#
# WHAT BELONGS IN THIS FILE: what each field does, what value is live, and what
# breaks if you change it. Measurements live in docs/BENCHMARKS.md (generated
# from the docs/benchmarks.jsonl ledger); the story of how a config was chosen
# lives in docs/LESSONS.md. Comments here point at those rather than restating
# them, so there is one place for a number to be wrong.
# =============================================================================

# -----------------------------------------------------------------------------
# BRAIN — daily driver: coding, vision, agentic, reasoning, tool calls
# -----------------------------------------------------------------------------
# STATUS (2026-08-27): 23.85 tok/s decode with the DSpark drafter, from a
# measured 12.0 tok/s non-speculative floor at 245 GB/s achieved bandwidth. That
# floor IS the bandwidth ceiling. VRAM ~55 GB at 0.45 util. Output is unchanged
# at every step — speculative decoding verifies every draft against the real
# model. Details: docs/LESSONS.md #18 and #20, docs/BENCHMARKS.md.
# Rollback: `git checkout v4.2.1` (FP8 MoE baseline, ~53 tok/s, no vision).
#
# ⚠️  docs/BENCHMARKS.md CURRENTLY SHOWS THIS CONFIG AS FAILED. It is not.
# The ledger holds three rows named `spec-dspark7`: a VALID 23.85 tok/s run
# against /models/qwen38-27b-dspark (the drafter pinned below), and two FAILED
# runs, the last of which tested a DIFFERENT checkpoint — qwen38-27b-dspark-nvfp4.
# The renderer keys rows by name alone, so the unrelated failure overwrote the
# real result and BENCHMARKS.md now recommends spec-dspark5 (22.7) over a config
# it believes is broken. Do not "fix" the live config on the strength of that
# row. Verify against docs/benchmarks.jsonl, where all three rows survive.
#
# THREE THINGS THE STARTUP LOG SAYS THAT NOTHING HAS MEASURED (2026-08-27).
# Observations from one clean boot, not verdicts. Recorded so the next person
# reads them instead of re-deriving them; `bash scripts/benchmark.sh` is what
# turns any of them into a number.
#   1. The drafter is BLIND ON IMAGES — it logs that it falls back to text-only
#      draft inputs. Output is unaffected (every draft is verified), but
#      acceptance on image turns should fall, and 23.85 was measured on text.
#   2. ~59 GiB SITS IDLE at 0.45 util — vLLM offers --kv-cache-memory=84.18 GiB
#      against 26.21 GiB in use. Do NOT take it for speed: the util-080 row
#      measured 15.07 vs 15.18 tok/s. It buys concurrency, nothing else.
#   3. SAMPLING DEFAULTS COME FROM THE CHECKPOINT, not from this file:
#      generation_config.json sets temperature 1.0, top_k 20, top_p 0.95. A
#      client that sends no temperature generates at 1.0 — hot for agentic tool
#      calling. Check what the client sends before blaming the model.
# (A fourth was listed here until LESSONS.md #20 answered it — see
# max_num_batched_tokens below.)
# -----------------------------------------------------------------------------
brain:
  name: qwen38-27b-nvfp4
  hf_repo: unsloth/Qwen3.8-27B-NVFP4
  # Optional revision pin. Blank = latest on main at pull time, the right
  # default for a fresh drop (first uploads ship broken — what the
  # tokenizer-truncation check in 02_download_models.sh exists to catch).
  # 02 records what it resolved to in <local_path>/DOWNLOADED_REVISION.txt, so
  # running weights stay attributable even when this is blank. Set it to that
  # SHA to freeze them.
  # hf_revision: <sha>
  local_path: /opt/models/qwen38-27b-nvfp4
  port: 8000
  # Interface vLLM listens on. Loopback serves this box only; 0.0.0.0 would
  # expose the Brain to every host on the LAN, unauthenticated by default.
  bind_host: 127.0.0.1
  served_name: qwen38-27b             # arbitrary label; if you change it, re-point OpenClaw
  docker_image: vllm/vllm-openai:qwen38-arm64-cu130   # arm64 — GB10 is an ARM host
  gpu_memory_utilization: 0.45
  max_model_len: 262144
  kv_cache_dtype: fp8
  max_num_seqs: 16
  # vLLM warns at every boot that 7 draft slots leave
  # max_num_scheduled_tokens=8096 and calls it "suboptimal". Measured and
  # settled: 16384 gave 23.79 vs 23.91: noise. Reverted. LESSONS.md #20.
  max_num_batched_tokens: 8192
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  # CONFIRMED LIVE (2026-08-26): 37.4% of a repeated identical prefix served
  # from cache, via vllm:prefix_cache_hits_total / _queries_total. Reports that
  # vLLM silently disables prefix caching for this model do not reproduce here.
  #
  # JUDGE IT ON THE HIT-RATE COUNTER, NEVER ON A TTFT SPEEDUP. The TTFT ratio
  # for the same working cache has measured 0.90x to 4.51x depending on server
  # state; an early audit called a working cache "INERT" on one low reading.
  #
  # This cannot currently be turned OFF: prefix caching is on by default in
  # vLLM V1, so omitting the flag does not disable it — that needs
  # --no-enable-prefix-caching, which the launcher does not emit. The benchmark
  # matrix's prefix-off row is PARTIAL for exactly this reason.
  #   bash scripts/benchmark.sh audit      # read-only, does not restart Brain
  enable_prefix_caching: true
  # Attention backend, passed through as VLLM_ATTENTION_BACKEND.
  #
  # BLANK ON PURPOSE = vLLM autoselects. It picks FLASHINFER out of
  # ['FLASHINFER', 'TRITON_ATTN'], and pinning FLASHINFER explicitly measured
  # identically (15.15 vs 15.15 tok/s), so blank is the same thing with one less
  # thing to keep in sync.
  #
  # DO NOT SPEND TIME HERE. TRITON_ATTN cannot be selected on this model — both
  # the env var and the CLI flag are accepted and silently overridden — and it
  # would not matter if it could: every backend/KV/utilisation row landed inside
  # 15.07-15.19 tok/s. Speculative decoding is the only lever that moves
  # single-stream decode. Closed question; evidence in LESSONS.md #19.
  attention_backend:
  # ACTIVE: DSpark drafter, 7 tokens. Three runs: 23.85, 23.91, 23.79.
  #
  # THE 23.9 BELONGS WITH ITS WORKLOAD. +21.6% on agentic coding (a file in
  # context, rewritten); no gain at all on open-ended prose, where it and MTP
  # are indistinguishable at ~17. A drafter only wins where output is
  # predictable. Quote it with the workload attached or not at all.
  #
  # EXPECT ~17 tok/s DAY TO DAY on a working box, not the sweep numbers - decode
  # tracks acceptance, and acceptance tracks the sampled continuation. Read the
  # matrix as a RANKING measured back-to-back, not a throughput guarantee.
  #
  # DO NOT RAISE num_speculative_tokens. 7 is the drafter's own block_size, and
  # width is free inside one block but costs a whole extra draft pass beyond it:
  # 12 measured 19.13 and 20 measured 17.16. The curve is an inverted U and 50
  # tok/s is not reachable by width. Full table: LESSONS.md #20.
  #
  # THE PATH HERE IS THE CONTAINER PATH. MODELS_DIR is bind-mounted at /models
  # and this JSON reaches the engine verbatim, so it must be /models/<name> —
  # not the host path in speculative_draft_model below, which is where
  # 02_download_models.sh writes. Same weights, different namespaces; getting it
  # wrong yields "Invalid repository ID or local directory specified".
  #
  # KNOWN TRADE: aggregate throughput at 8 concurrent streams drops from 102.5
  # to 80.2 tok/s. Speculation competes for compute a saturated GPU was already
  # using, so it helps an idle box and hurts a busy one. This box is
  # interactive, one stream at a time. Revert to the MTP fallback if that stops
  # being true.
  #
  # FALLBACK, needs no external checkpoint — the checkpoint's own MTP heads:
  #   '{"method":"mtp","num_speculative_tokens":3}'   19.66 tok/s, 64.4% acc
  # Also the better choice under concurrency. Use 3, not 5: 5 measured 15.18,
  # worse than 3 AND worse than 2.
  #
  # NGRAM IS RULED OUT FOR THIS MODEL across five configurations — but it still
  # beat no speculation, so it is worth having on a checkpoint with no MTP
  # heads. Judge any future attempt on ACCEPTANCE x FIRING RATE, never either
  # alone. Why more tuning will not rescue it: LESSONS.md #19.
  #
  #   bash scripts/benchmark.sh audit       # what is live, read-only
  #   bash scripts/benchmark.sh             # sweeps and records the winner
  #   bash scripts/benchmark.sh bandwidth   # is a ceiling real? read-only
  speculative_config: '{"method":"dspark","model":"/models/qwen38-27b-dspark","num_speculative_tokens":7}'
  extra_env:
    CUTE_DSL_ARCH: sm_121a
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  limit_mm_per_prompt: '{"image":10}'   # keep space-free: the `serve` entrypoint branch word-splits VLLM_EXTRA_ARGS
  # Raw CLI flags appended to the vLLM command, space-separated. BLANK IN
  # PRODUCTION and should stay that way — an experiment hatch, so one benchmark
  # row can test a guess (a wrong flag fails that row and is recorded FAILED)
  # without baking the guess into the launcher.
  # Use --flag=value, never --flag value: benchmark.sh splits overrides on
  # whitespace, so a space becomes two separate overrides.
  extra_args:
  # Drafter checkpoint. Host path — benchmark.sh rewrites an absolute path to
  # its in-container location (/models/<name>); an HF repo id (contains a slash,
  # does not start with one) is passed through unchanged.
  #
  # THE ONLY LEVER LEFT. Decode is bandwidth-bound at 12.04 tok/s per forward
  # pass and no config beats it, so the only way past is more TOKENS per pass —
  # entirely a function of draft acceptance. Not the engine: SGLang measured
  # 9.79 tok/s here, 19% SLOWER than vLLM, so the community's SGLang numbers are
  # really about their drafter. LESSONS.md #19.
  #
  # A DRAFTER MUST BE TRAINED AGAINST THIS CHECKPOINT. One trained for a
  # different model loads and drafts garbage: acceptance collapses and you get a
  # slow, correct answer, since rejected drafts still cost verification. Check
  # the acceptance rate in docs/BENCHMARKS.md — below ~0.4 it is hurting.
  #
  # Two drafters exist for this checkpoint:
  #   RadixArk/Qwen3.8-27B-DSpark   LIVE. Extends DFlash with target-model
  #                                 auxiliary features and a confidence head.
  #                                 This build registers DSparkDraftModel and
  #                                 Qwen3DSparkModel by name, and accepts
  #                                 method "dspark".
  #   incoai/Qwen3.8-27B-DFlash2    REJECTED by our image. Its config declares
  #                                 DFlash2DraftModel; this build registers
  #                                 DFlashDraftModel (no "2"), so it landed
  #                                 DFlash v1. A block-diffusion drafter with
  #                                 its own method name — NOT eagle3 — invoked
  #                                 as {"method":"dflash", "model":<path>,
  #                                 "num_speculative_tokens":7}. Needs vLLM
  #                                 built from PR #52816, which our pinned image
  #                                 may predate.
  #
  # Check before downloading several GB — no hits means this build cannot serve
  # it and no config field will change that:
  #   docker run --rm --entrypoint bash vllm/vllm-openai:qwen38-arm64-cu130 \
  #     -c 'grep -rl dflash /usr/local/lib/python3*/dist-packages/vllm/ | head'
  # Then: bash scripts/benchmark.sh --only spec-dflash7,spec-dflash3
  speculative_draft_model: /opt/models/qwen38-27b-dspark
  speculative_draft_repo: RadixArk/Qwen3.8-27B-DSpark

  # Bytes ONE TOKEN actually reads. Dense models read the whole checkpoint, so
  # leave this blank and benchmark.sh uses the file size. An MoE reads only its
  # active experts, and the checkpoint size is then several times too large a
  # denominator — benchmark.sh detects declared experts and refuses to compute a
  # roofline ratio until this is set, rather than printing a wrong verdict.
  active_weight_gb:

  # --- SWAP EXAMPLES ---
  # Refusal-ablated builds of this same base checkpoint are surveyed and ranked
  # in docs/ABLITERATED_CANDIDATES.md, with machine-readable detail in
  # config/brain_candidates.yml. Ten servable candidates, ready-to-paste brain
  # blocks for the top four, and the ~20 repos that CANNOT load here (GGUF, MLX,
  # EXL3) so nobody re-surveys HuggingFace and re-finds them. Nothing in either
  # file has been measured on this machine.
  #
  # ⚠️  ANY SWAP THAT CHANGES served_name REQUIRES A MANUAL OPENCLAW RECONFIG on
  # the Spark afterwards. Until you do it, OpenClaw is aimed at a model ID that
  # no longer exists and fails to connect even though the brain is healthy. To
  # skip that step, set served_name to whatever OpenClaw already points at.
  #
  # ⚠️  A DRAFTER PINNED ABOVE IS TIED TO THE CHECKPOINT ABOVE. Swapping the
  # brain without also swapping or clearing speculative_config and
  # speculative_draft_model leaves a mismatched drafter in place — correct
  # output, collapsed acceptance.
  #
  # ROLLBACK — tag v4.2.1 is the last release verified on this hardware
  # (~53 tok/s, FP8 MoE, no vision). `git checkout v4.2.1` restores the stack.
  #
  # Previous brain (Qwen3.6-35B-A3B MoE, NVFP4 — speed never measured):
  # name: qwen36-35b-a3b-nvfp4
  # hf_repo: unsloth/Qwen3.6-35B-A3B-NVFP4
  # local_path: /opt/models/qwen36-35b-a3b-nvfp4
  # served_name: qwen36-35b
  # docker_image: vllm/vllm-openai:cu130-nightly   # tag not rebuilt since 2026-04-23
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # moe_backend: flashinfer_b12x        # REQUIRED for that MoE on Spark, or it falls back to Marlin and runs 2.5x slower
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # Measured-good fallback (Qwen3.6-35B-A3B FP8 — ~53 tok/s, the v4.0/v4.2.1 brain):
  # name: qwen36-35b-a3b-fp8
  # hf_repo: Qwen/Qwen3.6-35B-A3B-FP8
  # local_path: /opt/models/qwen36-35b-a3b-fp8
  # served_name: qwen36-35b
  # docker_image: vllm/vllm-openai:cu130-nightly
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # extra_env:
  #   VLLM_FLASHINFER_MOE_BACKEND: latency    # Required for SM12.1 MoE kernels on Blackwell (FP8 path only)
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # OPTION 2 — Qwen3-Coder-Next-80B-A3B (coding specialist — a TRADE, not an
  # upgrade). 80B total / 3B active. NEVER BENCHMARKED HERE, and the comparison
  # below is against the SUPERSEDED Qwen3.6-35B brain, not the Qwen3.8-27B one
  # running now — treat it as an argument that was made, not a current verdict.
  #
  #   Benchmark              Coder-Next    Qwen3.6-35B (the brain at the time)
  #   SWE-Bench Verified        70.6            73.4
  #   Terminal-Bench 2.0        36.2            51.5
  #   SWE-Bench Pro             44.3             n/a
  #
  # Published SWE-bench values for it range 70.6 / 71.3 / 74.2 by scaffold. Only
  # compare same-scaffold numbers; 70.6 is Qwen's own.
  #
  # The genuine case is what benchmarks measure poorly: RL-trained for
  # long-horizon agentic coding — sustained tool use and recovery from failed
  # tool calls, which maps onto OpenClaw. Worth it ONLY if agentic coding is
  # overwhelmingly your primary use.
  #
  # What you GIVE UP: vision entirely (text-only — do not carry
  # limit_mm_per_prompt over); thinking mode entirely (the card is explicit that
  # it emits no <think> blocks, so leave reasoning_parser blank — the launcher
  # passes it conditionally); and general chat/reasoning quality.
  #
  # Use the 4-bit build, NOT FP8: Unsloth puts Coder-Next at ~85GB in 8-bit,
  # which would consume the whole budget and leave nothing for KV cache. The
  # NVFP4 GB10 build is ~46GB, quantized for Spark. Caveat: an NVIDIA forum
  # thread reports slow perf on RedHatAI's NVFP4 build of this model, so measure
  # before trusting. Values below are a STARTING POINT.
  # name: qwen3-coder-next-nvfp4
  # hf_repo: saricles/Qwen3-Coder-Next-NVFP4-GB10   # GB10-tuned; ~46GB weights
  # local_path: /opt/models/qwen3-coder-next-nvfp4
  # served_name: qwen3-coder-80b        # CHANGED -> manual OpenClaw reconfig required
  # gpu_memory_utilization: 0.80        # ~97GB; ~46GB weights leaves ~51GB KV — VERIFY with nvidia-smi
  # max_model_len: 262144               # 256K native; drop to 131072 first if it OOMs
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder       # confirmed same parser family
  # reasoning_parser:                   # INTENTIONALLY BLANK — no thinking mode
  # moe_backend: flashinfer_b12x        # NVFP4 MoE; the active dense brain does not use this
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # # limit_mm_per_prompt: OMITTED ON PURPOSE — text-only model

# -----------------------------------------------------------------------------
# SGLANG — second engine, for head-to-head comparison. NOT WIRED INTO BOOT.
# -----------------------------------------------------------------------------
# The strongest reported throughput configs for this model on GB10 run SGLang
# with a DFlash2 drafter rather than vLLM. Whether that holds here is open, and
# a comparison that could only launch vLLM would never find out — so SGLang is a
# first-class row in benchmark.sh's matrix rather than an assumption.
#
# UNCOMMENT ONLY docker_image TO ENABLE. Everything else falls back to brain:
# above, so both engines serve the same weights at the same port under the same
# served name — which is what makes the comparison fair. No image is pinned
# because none has been verified here and guessing a tag costs a 5-minute load
# to learn nothing; until one is set, every SGLang scenario records BLOCKED in
# docs/BENCHMARKS.md — missing data rather than silently absent. You need a
# build for SM121 / arm64.
#
# ONLY scripts/benchmark.sh READS THIS. boot_sequence.sh, watchdog.sh and the
# numbered setup scripts do not, and must not: watchdog recovery calls
# start_brain_ad_hoc.sh, which starts vLLM, so a crash during an SGLang session
# silently reverts the engine. Stop the watchdog timer for any SGLang work —
# benchmark.sh does this for you.
sglang:
  docker_image: lmsysorg/sglang:latest
  mem_fraction_static: 0.45           # SGLang's name for gpu_memory_utilization
  quantization:
  attention_backend: flashinfer       # SGLang's own backend names, not vLLM's
  tool_call_parser: qwen25
  reasoning_parser: qwen3
  disable_radix_cache: false          # radix cache = SGLang's prefix cache, ON by default.
                                      # Note the inverted sense vs vLLM's enable_prefix_caching.
  # DFlash2 needs a drafter checkpoint downloaded separately; leave the path
  # blank and this falls back to whatever the build supports natively.
  speculative_algorithm:              # e.g. EAGLE / NEXTN — depends on the build
  speculative_num_steps:
  speculative_draft_model_path:

