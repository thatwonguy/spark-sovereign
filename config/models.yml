# -----------------------------------------------------------------------------
# MEMORY MAP (128GB unified, 121.69 GiB visible to CUDA)
# -----------------------------------------------------------------------------
# Brain is measured (~55 GB at 0.45 util, per the STATUS block above). The
# always-on services are PROJECTIONS — replace them with real numbers from
# check_stack.sh / nvidia-smi.
#
#   Qwen3.8-27B NVFP4 (Brain)   ~54.8 GB   measured, 0.45 util
#   ASR (nemotron-speech)         3.0 GB   projected, always-on
#   TTS (magpie_tts)              1.4 GB   projected, always-on
#   SearXNG                       0.5 GB   projected, always-on
#   NemoClaw + OpenClaw           1.0 GB   projected, always-on
#   OS + Docker + vLLM            6.0 GB   projected, always-on
#   ──────────────────────────────────────
#   TOTAL                       ~66.7 GB
#   HEADROOM                    ~55.0 GB
#
# The headroom is large because the brain runs at 0.45 util. See observation 3
# in the STATUS block before spending it: more KV cache buys concurrency, not
# single-stream speed.
