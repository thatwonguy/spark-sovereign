  # # limit_mm_per_prompt: OMITTED ON PURPOSE — text-only model

  # VERIFIED IMAGE MATRIX (2026-08-27) — this section is measurement, not
  # inference. Two prior notes here were wrong in opposite directions, one
  # claiming vLLM upstream lacked support and one claiming it had shipped.
  # Both were read off a vendor page instead of the engine.
  #
  #   image                              sm_121   Qwen4Exp
  #   vllm/vllm-openai:qwen38-arm64-cu130   yes       NO
  #   vllm/vllm-openai:nightly              NO        NO
  #
  # nightly's arch list is ['sm_80','sm_90','sm_100','sm_110','sm_120'] — it
  # stops one short of GB10, which is why the custom cu130 tag exists at all.
  # nightly's Qwen registry tops out at Qwen3_5* with no Flash-Next entry under
  # any alias, so support is not merged there either.
  #
  # A vLLM recipe page for this model does exist, which is what prompted the
  # second wrong note. Nightly not registering the architecture means that page
  # most likely documents a PR-branch install, the same way the DFlash2 card
  # specified `pip install vllm @ git+...refs/pull/52816/head`. UNVERIFIED —
  # do not act on it either way without checking a build.
  #
  # WHAT IS ACTUALLY NEEDED: one image with BOTH sm_121 and Qwen4Exp. Nobody
  # publishes one today. Check any candidate with two commands before believing
  # anything else about this model:
  #
  #   docker run --rm --entrypoint python3 <IMG> -c \
  #     "from vllm.model_executor.models.registry import ModelRegistry as R; \
  #      print(sorted(a for a in R.get_supported_archs() if 'Qwen' in a))"
  #   docker run --rm --gpus all --entrypoint python3 <IMG> -c \
  #     "import torch; print(torch.cuda.get_arch_list())"
  #
  # Both must pass. Either alone is not runnable on this box.
  #
  # CORRECTION (2026-08-27): the previous note here said vLLM upstream does not
  # support this architecture and that Unsloth could not quantize until it did.
  # BOTH WRONG. vLLM has an official recipe page for Qwen3.8-Flash-Next, and
  # NVFP4/FP8/GGUF builds exist today. What is actually missing is Qwen4Exp
  # support in OUR PINNED arm64 image — a much narrower and more tractable gap.
  # The error came from reading one vendor's gating notes instead of checking
  # the engine, which is the same failure this repo keeps recording.
  #
  # THE REAL BLOCKER: vllm/vllm-openai:qwen38-arm64-cu130 registers no Qwen4*
  # architecture. Verify before anything else, and re-check after any image bump:
  #   docker run --rm --entrypoint python3 <image> -c \
  #     "from vllm.model_executor.models.registry import ModelRegistry as R; \
  #      print([a for a in R.get_supported_archs() if 'Qwen4' in a])"
  # Empty list = blocked, and no config below matters.
  #
  # WEIGHTS THAT EXIST (preflight each before trusting a name):
  #   Inferact/Qwen3.8-Flash-Next-NVFP4    <- the one that fits, see below
  #   Qwen/Qwen3.8-Flash-Next-FP8          official FP8
  #   unsloth/Qwen3.8-Flash-Next-FP8
  #   unsloth/Qwen3.8-Flash-Next-GGUF      llama.cpp path, outside this stack
  #   Qwen/Qwen3.8-Flash-Next              unquantized, 335.3 GiB, will not fit
  #
  # PLE-OFFLOAD IS WHAT MAKES THIS FIT, and it removes the risk flagged above.
  # vLLM can offload the 51B n-gram embedding table to HOST memory so it never
  # occupies VRAM. With that, only the 125B MoE is resident:
  #
  #   NVFP4 + PLE-Offload   ~62 GiB on GPU   ~48 GiB left for KV   <- viable
  #   NVFP4, both resident  ~88 GiB          no real KV headroom
  #   FP8  + PLE-Offload    ~125 GiB         does not fit
  #
  # So NVFP4 is not a preference here, it is the only build that fits, and the
  # offload flag is mandatory rather than an optimisation.
  #
  # REQUIRED HF OVERRIDES — the recipe specifies rope parameters that are not
  # in config.json. Omitting them does not error, it degrades long context:
  #   mrope_interleaved: true
  #   mrope_section: [11, 11, 10]
  #   rope_type: yarn
  #   rope_theta: 10000000
  #   partial_rotary_factor: 0.25
  #   factor: 4.0
  #   original_max_position_embeddings: 262144
  # Also recommended: --no-enable-flashinfer-autotune, --enable-expert-parallel,
  # --tool-call-parser qwen3_coder, --reasoning-parser qwen3.
  #
  # Note the recipe's hardware guidance targets GB300 with TP2 minimum for FP8.
  # We have ONE GB10, so TP1 with NVFP4 plus PLE-Offload is a configuration
  # nobody has published numbers for. Expect to measure rather than copy.
  #
  # OPTION 3 — Qwen3.8-Flash-Next (STAGED, BLOCKED — preflight 2026-08-27):
  #
  # PREFLIGHT RESULT: BLOCKED on two counts. Neither is a config problem.
  #
  #   1. Qwen4ExpForConditionalGeneration is NOT in this image's vLLM registry.
  #      The image cannot load the model at any size. Needs a newer arm64/SM121
  #      build. Same shape as the DFlash2 rejection on the 27B: the engine is a
  #      version behind the checkpoint.
  #   2. The only UNGATED repo is the unquantized upload — 335.3 GiB across 131
  #      shards, against 121.69 GiB of GPU. Both NVFP4 repos exist but are
  #      GATED — and per Unsloth's own docs the NVFP4 quant DOES NOT EXIST
  #      YET. They gate it on three things: license review, architecture
  #      verification (MTP head layout, linear-attention naming, and the 51B
  #      n-gram embedding path all need mapping), and TOOLCHAIN SUPPORT —
  #      llm-compressor / vLLM / llama.cpp shipping the new architecture.
  #
  #      So blockers 1 and 2 are the SAME blocker. The registry gap is not our
  #      image lagging; it is vLLM upstream not supporting Qwen4 yet, which is
  #      exactly what Unsloth is waiting on before they can quantize. Accepting
  #      a license cannot produce weights nobody has made.
  #
  #      Their gate 2 also names the risk this block already flagged: the 51B
  #      n-gram path is the unmapped piece, and it decides whether this fits.
  #      (was: set HF_TOKEN and accept the license, then re-run preflight to
  #      get the real shard total.
  #
  # MEASURED BY PREFLIGHT (these are no longer guesses):
  #   architecture     Qwen4ExpForConditionalGeneration
  #   context          262144
  #   experts/active   512 / 10 per token
  #   vision           YES
  #   hidden layers    48
  #   unquantized      335.3 GiB
  #
  # FIT ARITHMETIC, for when the NVFP4 total arrives:
  #   GPU visible            121.69 GiB
  #   always-on reserved      11.90 GiB  (ASR/TTS/SearXNG/OS/Docker)
  #   budget                 109.79 GiB
  # NVFP4 has to land under ~92 GiB to leave a usable ~18 GiB of KV cache. A
  # naive /4 of 335.3 is ~84 GiB, which fits but barely — and that estimate
  # ignores whatever the N-gram table does, which is the whole risk. Do not
  # download on the estimate; re-run preflight once the gate is accepted.
  # 125B total / ~6B active MoE, plus a separate ~51B N-gram embedding table.
  # Architecture preview of Qwen4. Unsloth is shipping day-zero quants.
  #
  # Uncomment this block only after preflight returns CLEAR. It prints every
  # value marked LOOKUP below, and resolves whichever repo name Unsloth used:
  #   bash scripts/preflight_model.sh \
  #       unsloth/Qwen3.8-Flash-Next-NVFP4 \
  #       unsloth/Qwen3.8-Flash-Next-125B-A6B-NVFP4 \
  #       unsloth/Qwen3.8-Flash-Next
  #
  # GO/NO-GO: 176B parameters have to be stored (125B MoE + 51B N-gram), which
  # is ~92 GiB at NVFP4 and leaves ~18 GiB for KV cache. If the N-gram table
  # ships BF16 it is ~95 GiB on its own and will not fit on one GB10 at any
  # context length. Preflight's shard total answers this before you download.
  #
  # PREFLIGHT: CLEAR (2026-08-27). Every value below is measured or verified
  # against the engine, not copied from a docs page — two claims about this
  # model were wrong today from doing exactly that.
  #
  # name: qwen38-flash-next-nvfp4
