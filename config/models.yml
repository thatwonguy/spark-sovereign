# =============================================================================
# MODEL REGISTRY — spark-sovereign
# =============================================================================
# This is the single source of truth for all models in the stack.
# To swap any model:
#   1. Edit the relevant section below
#   2. Re-run the corresponding script (scripts/02_download_models.sh, etc.)
#   3. Restart the affected Docker container
#
# All scripts source this file via `yq` or the helper `config/parse_models.sh`
# =============================================================================

# -----------------------------------------------------------------------------
# BRAIN — daily driver: coding, vision, agentic, reasoning, tool calls
# -----------------------------------------------------------------------------
# Qwen3.6-35B-A3B-NVFP4: same model/weights as the FP8 rollback below, just
# quantized to NVFP4 (Blackwell-native 4-bit) by Unsloth (released 2026-07-10).
# Same benchmarks, same parsers, same 262K context — this is a SPEED-ONLY swap.
# ~1.56x faster decode than FP8 (community DGX Spark benchmark). The "-Fast"
# variant (W4A4) is ~1.79x but trades a bit more accuracy — skip it for now.
# CRITICAL on Spark: --moe-backend flashinfer_b12x is REQUIRED or inference is
# 2.5x SLOWER than FP8 (falls back to Marlin W4A16). Do not omit it.
# Do NOT set `quantization:` — vLLM auto-detects NVFP4 from the checkpoint.
# Do NOT add speculative decoding (MTP degrades perf on Spark — see LESSONS.md).
# -----------------------------------------------------------------------------
brain:
  name: qwen36-35b-a3b-nvfp4
  hf_repo: unsloth/Qwen3.6-35B-A3B-NVFP4
  local_path: /opt/models/qwen36-35b-a3b-nvfp4
  port: 8000
  served_name: qwen36-35b
  docker_image: vllm/vllm-openai:cu130-nightly
  gpu_memory_utilization: 0.80        # weights shrink to ~24GB (from ~35GB FP8) — same util, more KV cache headroom; re-tune later if desired
  max_model_len: 262144               # unchanged — NVFP4 build still natively supports 262K
  kv_cache_dtype: fp8
  max_num_seqs: 16                    # Single-user — lower = less scheduling overhead per decode step
  max_num_batched_tokens: 8192        # Large batch for improved throughput
  tool_call_parser: qwen3_coder       # Same parser as FP8 — same family
  reasoning_parser: qwen3             # Same parser as FP8 — same family
  moe_backend: flashinfer_b12x        # REQUIRED on Spark — see comment above
  extra_env:
    CUTE_DSL_ARCH: sm_121a                  # Required arch flag for NVFP4 on Blackwell/Spark
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1        # Allow 262K context without warning
  limit_mm_per_prompt: '{"image": 10}'  # multimodal: allow up to 10 images per request
  # --- SWAP EXAMPLES ---
  # Previous FP8 model (rollback — same intelligence, ~53 tok/s instead of ~80):
  # name: qwen36-35b-a3b-fp8
  # hf_repo: Qwen/Qwen3.6-35B-A3B-FP8
  # local_path: /opt/models/qwen36-35b-a3b-fp8
  # served_name: qwen36-35b
  # gpu_memory_utilization: 0.80
  # max_model_len: 262144
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3
  # extra_env:
  #   VLLM_FLASHINFER_MOE_BACKEND: latency    # Required for SM12.1 MoE kernels on Blackwell (FP8 path only)
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # OPTION 2 — Qwen3-Coder-Next-80B-A3B (coding-specialized swap, NOT speed-only):
  # 80B total / 3B active (2.3x more experts than the 35B, same active-param
  # cost). SWE-Bench Verified 74.2% vs 73.4% above — small delta on paper; the
  # real case is agentic tool-use recovery / long-horizon coding, which SWE-Bench
  # doesn't fully capture. Trade-off: FP8 weights are ~2.3x heavier, so context
  # must shrink to fit on one Spark. Community-tested (NVIDIA dev forum): ~45
  # tok/s at these settings. Treat gpu_memory_utilization/max_model_len as a
  # starting point, not gospel — watch `check_stack.sh` / nvidia-smi and dial
  # down if it OOMs. reasoning_parser is UNVERIFIED for this model — test it.
  # name: qwen3-coder-next-80b-fp8
  # hf_repo: unsloth/Qwen3-Coder-Next-FP8-Dynamic
  # local_path: /opt/models/qwen3-coder-next-fp8
  # served_name: qwen3-coder-80b
  # gpu_memory_utilization: 0.70        # community-tuned for single Spark — verify
  # max_model_len: 130000               # down from 262144 — FP8 weights leave much less room for KV cache
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder       # confirmed same parser family
  # reasoning_parser: qwen3             # UNVERIFIED — Coder-Next may not support /think the same way as 3.6
  # extra_env:
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # limit_mm_per_prompt: '{"image": 10}'
  #
  # Dense 27B (slower but higher quality per active param):
  # name: qwen36-27b-fp8
  # hf_repo: Qwen/Qwen3.6-27B-FP8
  # local_path: /opt/models/qwen36-27b-fp8
  # gpu_memory_utilization: 0.75
  # max_model_len: 262144
  # max_num_seqs: 32
  # tool_call_parser: qwen3_coder
  # reasoning_parser: qwen3

