  # hf_repo: saricles/Qwen3-Coder-Next-NVFP4-GB10   # GB10-tuned; ~46GB weights
  # local_path: /opt/models/qwen3-coder-next-nvfp4
  # served_name: qwen3-coder-80b        # CHANGED -> requires manual OpenClaw reconfig (see above)
  # gpu_memory_utilization: 0.80        # ~97GB; ~46GB weights leaves ~51GB KV cache — VERIFY with nvidia-smi
  # max_model_len: 262144               # 256K native; drop to 131072 first if it OOMs
