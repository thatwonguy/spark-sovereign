  # limit_mm_per_prompt: '{"image": 10}'
  #
  # OPTION 2 — Qwen3-Coder-Next-80B-A3B (coding specialist — a TRADE, not an upgrade):
  # 80B total / 3B active, built on Qwen3-Next-80B-A3B-Base. Corrected against
  # the official Qwen model card (huggingface.co/Qwen/Qwen3-Coder-Next) — an
  # earlier version of this note used a third-party 74.2% SWE-bench figure that
  # made it look like a straight win. It isn't. Official numbers:
  #
  #   Benchmark              Coder-Next    Qwen3.6-35B (current)
  #   SWE-Bench Verified        70.6            73.4      <- current model WINS
  #   Terminal-Bench 2.0        36.2            51.5      <- current model WINS BIG
  #   SWE-Bench Pro             44.3             n/a
  #
  # Reported SWE-bench values for this model range 70.6 / 71.3 / 74.2 depending
  # on scaffold. Only compare same-scaffold numbers; 70.6 is Qwen's own.
  #
  # The genuine case for it is what benchmarks measure poorly: it is RL-trained
  # for long-horizon agentic coding — sustained tool use and recovery from failed
  # tool calls. That maps directly onto OpenClaw. Worth it ONLY if agentic coding
  # is overwhelmingly your primary use.
  #
  # What you GIVE UP by switching:
  #   - Vision. Coder-Next is TEXT-ONLY. Do not carry limit_mm_per_prompt over.
  #   - Thinking mode entirely. The card is explicit: "supports only non-thinking
  #     mode and does not generate <think></think> blocks." Leave reasoning_parser
  #     unset — there is no reasoning output to parse. (The launch scripts now
  #     pass --reasoning-parser conditionally, so blank is safe.)
  #   - Context: 256K native, but see memory notes below.
  #   - General (non-coding) chat and reasoning quality — it's a specialist.
  #
  # Use the 4-bit build, NOT FP8. Unsloth's own guidance puts Coder-Next at
  # ~85GB in 8-bit, which would eat the entire GPU budget and leave ~nothing for
  # KV cache — the FP8 config previously listed here would likely fail to boot.
  # The NVFP4 GB10 build is ~46GB and is quantized specifically for Spark.
  # Caveat: an NVIDIA forum thread reports slow perf on RedHatAI's NVFP4 build of
  # this model, so measure before trusting. Values below are a STARTING POINT.
  # ⚠️  NOT a config-only swap end to end: served_name changes below, so after the
  # brain comes up you MUST re-run the OpenClaw config manually on the Spark to
  # point it at the new model ID. Until you do, OpenClaw is aimed at a model ID
  # that no longer exists and will fail to connect even though the brain is
  # healthy. (The active Qwen3.8 config above ALSO changes served_name, so this
  # step is already required for the current swap regardless.)
  # If you'd rather skip the reconfig, set served_name to whatever OpenClaw is
  # already pointed at and it will reconnect untouched.
  # name: qwen3-coder-next-nvfp4
  # hf_repo: saricles/Qwen3-Coder-Next-NVFP4-GB10   # GB10-tuned; ~46GB weights
  # local_path: /opt/models/qwen3-coder-next-nvfp4
  # served_name: qwen3-coder-80b        # CHANGED -> requires manual OpenClaw reconfig (see above)
  # gpu_memory_utilization: 0.80        # ~97GB; ~46GB weights leaves ~51GB KV cache — VERIFY with nvidia-smi
  # max_model_len: 262144               # 256K native; drop to 131072 first if it OOMs
  # kv_cache_dtype: fp8
  # max_num_seqs: 16
  # max_num_batched_tokens: 8192
  # tool_call_parser: qwen3_coder       # confirmed same parser family
  # reasoning_parser:                   # INTENTIONALLY BLANK — no thinking mode
  # moe_backend: flashinfer_b12x        # NVFP4 MoE on Spark — the active dense brain does not use this
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # # limit_mm_per_prompt: OMITTED ON PURPOSE — text-only model

  # OPTION 3 — Qwen3.8-Flash-Next (STAGED, BLOCKED — preflight 2026-08-27):
  #
  # PREFLIGHT RESULT: BLOCKED on two counts. Neither is a config problem.
  #
  #   1. Qwen4ExpForConditionalGeneration is NOT in this image's vLLM registry.
  #      The image cannot load the model at any size. Needs a newer arm64/SM121
  #      build. Same shape as the DFlash2 rejection on the 27B: the engine is a
  #      version behind the checkpoint.
  #   2. The only UNGATED repo is the unquantized upload — 335.3 GiB across 131
  #      shards, against 121.69 GiB of GPU. Both NVFP4 repos exist but are
  #      GATED — and per Unsloth's own docs the NVFP4 quant DOES NOT EXIST
  #      YET. They gate it on three things: license review, architecture
  #      verification (MTP head layout, linear-attention naming, and the 51B
  #      n-gram embedding path all need mapping), and TOOLCHAIN SUPPORT —
  #      llm-compressor / vLLM / llama.cpp shipping the new architecture.
  #
  #      So blockers 1 and 2 are the SAME blocker. The registry gap is not our
  #      image lagging; it is vLLM upstream not supporting Qwen4 yet, which is
  #      exactly what Unsloth is waiting on before they can quantize. Accepting
  #      a license cannot produce weights nobody has made.
  #
  #      Their gate 2 also names the risk this block already flagged: the 51B
  #      n-gram path is the unmapped piece, and it decides whether this fits.
  #      (was: set HF_TOKEN and accept the license, then re-run preflight to
  #      get the real shard total.
  #
  # MEASURED BY PREFLIGHT (these are no longer guesses):
  #   architecture     Qwen4ExpForConditionalGeneration
  #   context          262144
  #   experts/active   512 / 10 per token
  #   vision           YES
  #   hidden layers    48
  #   unquantized      335.3 GiB
  #
  # FIT ARITHMETIC, for when the NVFP4 total arrives:
  #   GPU visible            121.69 GiB
  #   always-on reserved      11.90 GiB  (ASR/TTS/SearXNG/OS/Docker)
  #   budget                 109.79 GiB
  # NVFP4 has to land under ~92 GiB to leave a usable ~18 GiB of KV cache. A
  # naive /4 of 335.3 is ~84 GiB, which fits but barely — and that estimate
  # ignores whatever the N-gram table does, which is the whole risk. Do not
  # download on the estimate; re-run preflight once the gate is accepted.
  # 125B total / ~6B active MoE, plus a separate ~51B N-gram embedding table.
  # Architecture preview of Qwen4. Unsloth is shipping day-zero quants.
  #
  # Uncomment this block only after preflight returns CLEAR. It prints every
  # value marked LOOKUP below, and resolves whichever repo name Unsloth used:
  #   bash scripts/preflight_model.sh \
  #       unsloth/Qwen3.8-Flash-Next-NVFP4 \
  #       unsloth/Qwen3.8-Flash-Next-125B-A6B-NVFP4 \
  #       unsloth/Qwen3.8-Flash-Next
  #
  # GO/NO-GO: 176B parameters have to be stored (125B MoE + 51B N-gram), which
  # is ~92 GiB at NVFP4 and leaves ~18 GiB for KV cache. If the N-gram table
  # ships BF16 it is ~95 GiB on its own and will not fit on one GB10 at any
  # context length. Preflight's shard total answers this before you download.
  #
  # name: qwen38-flash-next-nvfp4
  # # LOOKUP: exact repo — preflight step 1 reports which candidate resolved
  # hf_repo: unsloth/Qwen3.8-Flash-Next-NVFP4
  # local_path: /opt/models/qwen38-flash-next-nvfp4
  # served_name: qwen38-flash-next      # CHANGED -> re-point OpenClaw, or set to the current ID to skip
  # # LOOKUP: needs a build that registers the Qwen4 arch. Unsloth's NVFP4
  # #         quantizes lm_head to FP8, so vLLM MAIN is required — the tag
  # #         below predates both and is a placeholder.
  # docker_image: vllm/vllm-openai:qwen38-arm64-cu130
  # # LOOKUP: preflight step 4 prints the max safe value for the real weights
  # gpu_memory_utilization: 0.90
  # # LOOKUP: preflight step 2 prints max_position_embeddings
  # max_model_len: 65536                # conservative start; raise once nvidia-smi confirms KV headroom
  # kv_cache_dtype: fp8
  # max_num_seqs: 4                     # 16 will not fit in ~18 GiB of KV cache
  # max_num_batched_tokens: 8192
  # # LOOKUP: confirm on the model card
  # tool_call_parser: qwen3_coder
  # # LOOKUP: leave blank if the card says no thinking mode (as Coder-Next does)
  # reasoning_parser:
  # moe_backend: flashinfer_b12x        # MoE — omitting this cost 2.5x on the last MoE brain
  # enable_prefix_caching: true
  #
  # # LOOKUP, and REQUIRED before any roofline number is believable. This is the
  # # bytes ONE TOKEN reads: shared layers plus experts_per_tok worth of expert
  # # weights, NOT the checkpoint size. A 125B/6B-active model reads a small
  # # fraction of its own file per pass, and benchmark.sh refuses to compute a
  # # ratio for a checkpoint declaring experts until this is set — it would
  # # otherwise divide by ~92 GiB, land near 0.2x, and print "the roofline is
  # # REAL" about a model nowhere near it. See LESSONS #18.
  # active_weight_gb:
  #
  # # SPECULATION — the single biggest lever on the 27B (+57% end to end), and
  # # the one thing about this model that is genuinely unknown.
  # #
  # # Everything measured on the 27B rests on MTP heads shipping INSIDE the
  # # checkpoint. If Qwen4 ships them, start at 3 draft tokens: 5 lost to 3, and
  # # 3 beat 2, because acceptance decays with draft position while every
  # # rejected token still costs its verification pass.
  # #
  # # If it does NOT ship them, n-gram is the free fallback and IS worth having.
  # # On the 27B it lost only because MTP was better — against no speculation it
  # # still won, 12.06-13.09 vs 11.22. Start at prompt_lookup_min 2: firing rate
  # # mattered more than per-draft accuracy in the product. See LESSONS #19.
  # #
  # # DSpark/DFlash drafters are 27B-specific and will NOT transfer. They are
  # # trained against one checkpoint's attention geometry — the NVFP4-trained
  # # DSpark failed on our own 27B with a 128-vs-256 tensor mismatch purely
  # # because the head dim differed. Do not assume a Flash-Next drafter exists.
  # speculative_config:
  #
  # extra_env:
  #   CUTE_DSL_ARCH: sm_121a
  #   VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  # # LOOKUP: preflight step 2 reports whether a vision block exists; delete if text-only
  # limit_mm_per_prompt: '{"image":10}'
  #
  # Swap:
  #   bash scripts/02_download_models.sh   # answer Y to archive the 27B — no re-download to roll back
  #   bash scripts/03_vllm_servers.sh
  # Roll back: sudo mv /opt/model-archive/qwen38-27b-nvfp4 /opt/models/ and re-point this block.

# -----------------------------------------------------------------------------
# SGLANG — second engine, for head-to-head comparison. NOT WIRED INTO BOOT.
# -----------------------------------------------------------------------------
# The strongest reported throughput configs for this model on GB10 run SGLang
# with a DFlash2 drafter, not vLLM. Whether that actually holds here is an open
# question, and a comparison that could only launch vLLM would never find out —
# so SGLang is a first-class row in scripts/benchmark.sh's matrix rather than an
# assumption.
#
# UNCOMMENT ONLY docker_image TO ENABLE. Everything else falls back to the
# brain: block above, so the two engines serve the same weights at the same
# port with the same served name — which is what makes the comparison fair.
#
# No image is pinned because none has been verified on this box, and guessing a
# tag costs a 5-minute load to learn nothing. Until one is set, every SGLang
# scenario is recorded as BLOCKED in docs/BENCHMARKS.md — visible as missing
# data rather than silently absent. You need a build for SM121 / arm64.
#
# Only scripts/benchmark.sh reads this.
# boot_sequence.sh, watchdog.sh and the numbered setup scripts do not, and must
# not: watchdog recovery calls start_brain_ad_hoc.sh, which starts vLLM, so a
# crash during an SGLang session silently reverts the engine. Stop the watchdog
# timer for any SGLang work (benchmark.sh does this for you).
#
sglang:
  docker_image: lmsysorg/sglang:latest
  mem_fraction_static: 0.45           # SGLang's name for gpu_memory_utilization
  quantization:
  attention_backend: flashinfer       # SGLang's own backend names, not vLLM's
  tool_call_parser: qwen25
  reasoning_parser: qwen3
  disable_radix_cache: false          # radix cache = SGLang's prefix cache, ON by default.
                                      # Note the inverted sense vs vLLM's enable_prefix_caching.
  # --- Speculative decoding (the reason SGLang is on the list at all) ---
  # DFlash2 needs a drafter checkpoint downloaded separately; leave the path
  # blank and this falls back to whatever the build supports natively.
  speculative_algorithm:              # e.g. EAGLE / NEXTN — depends on the build
  speculative_num_steps:
  speculative_draft_model_path:

