  # # 0.90 is the ceiling preflight reports; 0.85 leaves margin for the host-side
  # # PLE prefetch buffers, which are not in the GPU accounting.
  # gpu_memory_utilization: 0.85
  # max_model_len: 262144              # native. Beyond this needs yarn hf_overrides, see below
