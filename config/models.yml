# -----------------------------------------------------------------------------
# MEMORY MAP (128GB unified) — PROJECTION, not measured. Replace with real
# numbers from check_stack.sh / nvidia-smi after the first successful boot.
# -----------------------------------------------------------------------------
# Component                  Allocated   Note
# Qwen3.8-27B NVFP4 (Brain)   ~54.8 GB   0.45 util
# ASR (nemotron-speech)         3.0 GB   always-on
# TTS (magpie_tts)              1.4 GB   always-on
# SearXNG                       0.5 GB   always-on
# NemoClaw + OpenClaw           1.0 GB   always-on
# OS + Docker + vLLM            6.0 GB   always-on
# ─────────────────────────────────────────────────
# TOTAL                       ~66.7 GB   (on 121.69GiB visible to CUDA)
# HEADROOM                    ~55.0 GB
#
# If/when swapping to OPTION 2 (Qwen3-Coder-Next-80B, see commented block above):
# Do NOT use the FP8 build. Unsloth puts Coder-Next at ~85GB in 8-bit, and 0.70 util
# reserves ~85GB — weights would consume the entire budget and leave ~nothing for KV
# cache, so 130K context x 16 seqs would not fit. That config was wrong and has been
# replaced above with the NVFP4 GB10 build (~46GB weights, ~51GB KV cache at 0.80).
# Still an experiment: measure with check_stack.sh / nvidia-smi before trusting it.
