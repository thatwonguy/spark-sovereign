  # local_path: /opt/models/qwen38-flash-next-nvfp4
  # served_name: qwen38-flash-next     # CHANGED -> re-point OpenClaw after swapping
  #
  # # VERIFIED: registers Qwen4ExpForCausalLM and Qwen4ExpForConditionalGeneration,
  # # and carries vllm/models/qwen3_8_flash_next/ — purpose-built for this model.
  # # The stock and nightly images register neither.
  # docker_image: vllm/vllm-openai:qwen38-flash-next-arm64-cu130
