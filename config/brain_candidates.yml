# =============================================================================
# ABLITERATED BRAIN CANDIDATES — spark-sovereign
# =============================================================================
# Refusal-ablated variants of Qwen/Qwen3.8-27B — the SAME base checkpoint that
# config/models.yml's brain (unsloth/Qwen3.8-27B-NVFP4) was quantized from.
# These are drop-in replacements for the brain, not a different model family.
#
# NOTHING IN THIS FILE HAS BEEN MEASURED ON THIS MACHINE.
# Every refusal count, KL number and size below is a VENDOR CLAIM copied from a
# model card on 2026-09-04. They are recorded so the next person does not
# re-derive them, not so they can be cited as results. `bash scripts/benchmark.sh`
# is what turns any of them into a number, and docs/BENCHMARKS.md is where a
# number goes once it exists. Treat the `rank` field the same way: it is a
# reading of the cards, not of this hardware.
#
# NO SCRIPT READS THIS FILE. It is deliberately inert:
# 02_download_models.sh iterates the top-level sections of models.yml and
# ARCHIVES any /opt/models dir that no section claims. A candidate downloaded
# but not pasted into models.yml WILL be archived on the next run of 02. See
# docs/ABLITERATED_CANDIDATES.md for the download-and-test procedure that
# avoids that.
#
# Ranking axis, from the request that produced this file: most thoroughly
# unguardrailed AND still fast and capable on GB10, descending. Both halves
# matter — a model with 0/100 refusals that decodes at 4 tok/s loses to one
# with 0/100 refusals that decodes at 20.
# =============================================================================

# -----------------------------------------------------------------------------
# HOW FORMAT DECIDES MOST OF THIS RANKING
# -----------------------------------------------------------------------------
# The brain is served by vLLM in vllm/vllm-openai:qwen38-arm64-cu130. That one
# fact eliminates most of the ~30 abliterated Qwen3.8-27B repos on HuggingFace
# before capability is even considered:
#
#   NVFP4 (compressed-tensors)  SERVABLE, and the format the live brain already
#                               uses. An NVIDIA DGX Spark forum thread reports
#                               NVFP4 30-34% ahead of FP8 on decode for this
#                               model — THEIR number, not ours. This repo has
#                               never measured NVFP4 against FP8 on the same
#                               weights, so treat it as a reason to prefer
#                               NVFP4, not as a local result.
#   AWQ W4A16                   Servable via Marlin, slower than NVFP4. The
#                               sakamakismile card reports W4A16 failing to
#                               serve at all on SM120 under vLLM 0.22 — unproven
#                               for AWQ-Marlin specifically, but a warning.
#   BF16 safetensors            Servable and useless as a serving target. A
#                               dense 27B in BF16 reads ~55 GB per token; at the
#                               245 GB/s this box actually achieves (models.yml,
#                               measured) that is ~4-5 tok/s against the 12.0
#                               tok/s non-speculative floor we already have.
#                               BF16 repos here are QUANTIZATION SOURCES, not
#                               things to serve.
#   GGUF                        llama.cpp. Not this stack. Includes builds that
#                               say "NVFP4" but were made by llama.cpp — that is
#                               a different container format, not compressed-
#                               tensors, and vLLM will not load it.
#   MLX                         Apple Silicon. Cannot run on GB10 at all.
#   EXL3                        exllamav3. Not vLLM.
#
# Base-model refusal baseline, for reading the numbers below: the cards that
# publish one put stock Qwen/Qwen3.8-27B at 98-99 refusals per 100 harmful
# prompts. Lower is more unguardrailed. KL divergence vs base on BENIGN prompts
# is the capability-damage proxy: lower is less collateral damage.
# -----------------------------------------------------------------------------

candidates:

  # ===========================================================================
  # RANK 1 — the one to try first
  # ===========================================================================
  heretic-ara-nvfp4:
    rank: 1
    hf_repo: lyf/Qwen3.8-27B-Heretic-ARA-NVFP4-MTP-VL
    local_path: /opt/models/qwen38-27b-heretic-ara-nvfp4
    served_name: qwen38-27b-heretic
    format: nvfp4-w4a4-compressed-tensors
    size_gb: 20.56               # ~23 GB download with overhead
    upstream: heretic-org/Qwen3.8-27B-heretic-ara
    technique: Heretic v1.2.0+custom, Arbitrary-Rank Ablation (ARA)
    refusals_per_100: 0          # CLAIMED, upstream card; base is 99/100
    kl_vs_base: 0.0535           # CLAIMED, upstream card
    mtp_head: bf16-preserved     # 15 tensors
    vision_tower: bf16-preserved # 333 tensors
    quantizer: nvidia-modelopt -> ModelOptNvfp4Converter
    calibration: 20 x 8192 tok, CNN/DailyMail 3.0.0
    license: apache-2.0
    # WHY FIRST: it is the only build that is simultaneously (a) the most
    # thoroughly ablated variant anyone has published a number for, at a
    # claimed 0/100, and (b) already in the exact format this box serves
    # fastest. Everything else trades one of those away.
    # THE INTERESTING PART: the card says it was validated under
    # vllm/vllm-openai:qwen38-x86_64-cu130 — the x86_64 sibling of our pinned
    # arm64 image. Same image family means the vLLM build almost certainly has
    # the kernels. It does NOT mean the arch matches: they tested SM120
    # (RTX 5090), GB10 is sm_121a. That gap is the whole risk.
    unverified:
      - Never run on sm_121a. SM120 only.
      - W4A4 activation quant interacts with our fp8 KV cache in ways nobody measured.
      - Acceptance rate against the DSpark drafter is unknown (see NOTE below).

  # ===========================================================================
  # RANK 2 — the safe bet
  # ===========================================================================
  huihui-nvfp4:
    rank: 2
    hf_repo: sakamakismile/Huihui-Qwen3.8-27B-abliterated-NVFP4
    local_path: /opt/models/qwen38-27b-huihui-nvfp4
    served_name: qwen38-27b-huihui
    format: nvfp4-w4a4-g16-compressed-tensors
    size_gb: 20.0                # from 55.6 GB bf16
    upstream: huihui-ai/Huihui-Qwen3.8-27B-abliterated
    technique: directional orthogonalization, layers 18-51 only
    refusals_per_100:            # NOT PUBLISHED by huihui. This is the gap.
    kl_vs_base:                  # NOT PUBLISHED
    mtp_head: bf16-preserved
    vision_tower: bf16-preserved
    quantizer: llm-compressor
    license: apache-2.0
    downloads_last_month: 60541  # as of 2026-09-04 — by far the most-used here
    requantized: 2026-08-24      # picked up upstream's narrowing to layers 18-51
    # WHY SECOND AND NOT FIRST: huihui publishes no refusal number at all, and
    # their own card calls the method "a crude, proof-of-concept implementation
    # to remove refusals without using TransformerLens". They deliberately
    # NARROWED the ablation — first 15 layers retained, only 18-51 touched — to
    # protect base capability. That is a defensible engineering choice and it is
    # also, by construction, less thorough than rank 1. On the stated axis it
    # ranks below a build claiming 0/100.
    # WHY IT IS STILL THE SAFE BET: 60k downloads a month is the only real
    # operational evidence in this entire file. Rank 1 has none.
    unverified:
      - Tested on SM120 / RTX PRO 2000 with TP=4 and 32k ctx. We are sm_121a, single device, 262k.
      - Card states W4A16 does not serve on this arch under vLLM 0.22 — W4A4 only.
    fixed_in_current_rev: xhigh thinking-runaway (was present in prior revision)

  # ===========================================================================
  # RANK 3 — best uncensoring, wrong format; pull it to quantize it
  # ===========================================================================
  heretic-ara-bf16:
    rank: 3
    hf_repo: trohrbaugh/Qwen3.8-27B-heretic-ara
    local_path: /opt/models/qwen38-27b-heretic-ara-bf16
    format: bf16-safetensors
    size_gb: ~55
    technique: Heretic v1.2.0+custom, ARA
    refusals_per_100: 0          # CLAIMED; base 99/100
    kl_vs_base: 0.0535           # CLAIMED
    mtp_head: preserved
    vision_tower: preserved
    ara_params:
      start_layer: 26
      end_layer: 56
      preserve_good_behavior_weight: 0.9432
      steer_bad_behavior_weight: 0.0009
    license: apache-2.0
    # This is the SOURCE of rank 1, not a competitor to it. Its value is that it
    # lets us build our own NVFP4 against sm_121a with llm-compressor rather
    # than inheriting someone's SM120 build. That is the clean path if rank 1
    # benchmarks badly on GB10 — same weights, our own quantization.
    # DO NOT SERVE THIS DIRECTLY. ~55 GB/token at 245 GB/s is ~4-5 tok/s.
    serve_directly: false

  # ===========================================================================
  # RANK 4 — servable, weaker ablation, slower format
  # ===========================================================================
  jc-awq-mtp:
    rank: 4
    hf_repo: twolven/Qwen3.8-27B-abliterated-AWQ-MTP
    local_path: /opt/models/qwen38-27b-jc-awq
    served_name: qwen38-27b-jc-awq
    format: awq-w4a16-asym-g128
    size_gb: 9.37                # GiB resident, vs 15.11 for official FP8
    upstream: JonathanColetti/Qwen3.8-27B-Uncensored
    technique: Heretic, 200 optimization trials (inherited)
    refusals_per_100: 12         # CLAIMED by upstream; base 98/100
    kl_vs_base: 0.1191           # CLAIMED — the HIGHEST drift in this file
    capability_delta: mean -0.5 pts across MMLU / ARC / HellaSwag / Winogrande  # CLAIMED
    mtp_head: preserved
    vision_tower: bf16-preserved
    quantizer: llm-compressor 0.13.0
    license: apache-2.0
    released: 2026-08-15
    # The smallest servable build here, and the only AWQ one whose upstream
    # publishes both a refusal count and a capability delta. 12/100 is real
    # ablation but not rank 1's 0/100, and KL 0.1191 is an order of magnitude
    # more benign-prompt drift than rank 1's 0.0535 — it bought its uncensoring
    # with more collateral damage and still ended up less uncensored.
    unverified:
      - Benched on 2x RTX 3090 TP=2 (~84 tok/s median). Ampere, not Blackwell. Number does not transfer.
      - Needs vLLM with Qwen3_5ForConditionalGeneration + Qwen3_5MTP proposer (validated v0.20.2rc1). Our image is newer; check it did not drop the path.
      - AWQ-Marlin on sm_121a is untested here.

  # ===========================================================================
  # RANK 5 — the wildcard. Costs 8.6 MB and changes nothing else.
  # ===========================================================================
  cyber-lora:
    rank: 5
    hf_repo: msuiche/Qwen3.8-27B-abliterated-cyber-GLP-49
    local_path: /opt/models/qwen38-27b-cyber-lora
    format: peft-lora-rank1
    size_mb: 8.6
    base_revision: 1d4bf0f2ff60  # pinned against Qwen/Qwen3.8-27B
    technique: rank-1 LoRA, difference-of-means over 32+32 harmful/benign prompts
    delivery_rate: 81.2%         # CLAIMED, vs 3.1% for unmodified base
    over_refusal: none measured  # CLAIMED 100% compliance on held-out harmless
    license: apache-2.0
    updated: 2026-09-03
    # RANKED HERE ON EVIDENCE, BUT IT MAY BE THE BEST PRACTICAL ANSWER.
    # It is an adapter, not a checkpoint. If vLLM will serve it over the brain
    # we ALREADY run, then: base capability is bit-identical, the DSpark drafter
    # keeps its acceptance rate, no 20 GB download, and it toggles off with a
    # flag. Nothing else here can say any of that. 81.2% delivery vs 3.1% base
    # is roughly comparable to rank 4's ablation depth.
    # WHY IT IS NOT RANKED HIGHER: the entire proposition rests on an unverified
    # assumption.
    unverified:
      - CRITICAL — vLLM LoRA support over an NVFP4 quantized base is not established. If this does not load, the candidate is worth zero. Test this before anything else in the file; it is the cheapest test here by three orders of magnitude.
      - Card documents a long-form generation termination bug (2026-09-03) and recommends grammar-constrained output. That is a real agentic-workload hazard.

  # ===========================================================================
  # RANK 6-8 — BF16 quantization sources, weaker than rank 3 on the same axis
  # ===========================================================================
  jc-uncensored-bf16:
    rank: 6
    hf_repo: JonathanColetti/Qwen3.8-27B-Uncensored
    format: bf16-safetensors
    size_gb: ~55
    technique: Heretic, 200 trials; 128 attn+MLP projection modules, no fine-tuning
    refusals_per_100: 12         # CLAIMED; base 98/100
    kl_vs_base: 0.1191           # CLAIMED
    mtp_head: preserved and verified — all 15 MTP tensors restored from base
    vision_tower: preserved
    license: apache-2.0
    serve_directly: false
    # Upstream of rank 4. Strictly dominated by rank 3: same tool, worse refusal
    # count, twice the KL. Listed because its card is the most rigorous of the
    # set — it publishes an actual Pareto frontier and a benchmark delta.

  wangzhang-abliterix:
    rank: 7
    hf_repo: wangzhang/Qwen3.8-27B-abliterated
    format: bf16-safetensors-merged
    size_gb: ~55
    technique: Abliterix — 10 rounds iterative rank-32 LoRA self-distillation, KL-anchored
    refusals_per_100: 19         # CLAIMED
    kl_vs_base: 0.0069           # CLAIMED — lowest benign drift of any ablated build here
    mtp_head:                    # NOT STATED on the card
    vision_tower:                # NOT STATED
    license: apache-2.0
    published: 2026-08-15
    updated: 2026-08-20
    serve_directly: false
    # The only entry produced by actual TRAINING rather than a weight edit, so
    # it is the only one where "KL on benign prompts" understates the risk — a
    # distilled model can drift in ways a benign-prompt KL probe never samples.
    # 19/100 with silence on whether MTP and the vision tower survived 10 rounds
    # of LoRA merging is why it sits here.

  huihui-bf16:
    rank: 8
    hf_repo: huihui-ai/Huihui-Qwen3.8-27B-abliterated
    format: bf16-safetensors
    size_gb: 55.6
    technique: directional orthogonalization, layers 18-51
    refusals_per_100:            # NOT PUBLISHED
    mtp_head: unmodified
    vision_tower: unmodified
    license: apache-2.0
    released: 2026-08-18
    serve_directly: false
    # Upstream of rank 2. Only worth pulling to re-quantize for sm_121a
    # ourselves instead of using sakamakismile's SM120 build.

  # ===========================================================================
  # RANK 9-10 — listed to close them out
  # ===========================================================================
  hotdogs-trainingfree:
    rank: 9
    hf_repo: hotdogs/Qwen3.8-27B-abliterated
    format: bf16-safetensors
    technique: training-free orthogonalization, W <- W - lambda*r(rT W), lambda=1.2
    tensors_edited: 131          # 64 MLP down-proj, 48 linear-attn out, 16 full-attn proj
    refusals_per_100: 39         # CLAIMED; base 98/100
    kl_vs_base: 0.0001           # CLAIMED
    vision_tower: byte-for-byte untouched
    license: apache-2.0
    updated: 2026-08-16
    serve_directly: false
    # LAST ON THE STATED AXIS. KL 0.0001 and 39/100 refusals are the same fact
    # stated twice: it barely moved the weights, so it barely removed the
    # guardrails. It is the most conservative build here, which is the opposite
