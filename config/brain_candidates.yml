# =============================================================================
# NOTE — THE DRAFTER PROBLEM, WHICH APPLIES TO EVERY CANDIDATE ABOVE
# =============================================================================
# models.yml pins RadixArk/Qwen3.8-27B-DSpark as the speculative drafter and
# records 23.85 tok/s decode with it, against a 12.0 tok/s non-speculative floor.
# That drafter was trained against the UNABLATED Qwen3.8-27B.
#
# Correctness is not at risk: speculative decoding verifies every draft token
# against the target, so a swapped target still produces exactly the target's
# distribution. Throughput is very much at risk. Acceptance rate falls wherever
# the ablated target diverges from what DSpark predicts — and the ablation was
# performed precisely to change the model's next-token distribution in the
# refusal-adjacent region. Divergence there is the intended effect, not a bug.
#
# So: 23.85 tok/s is a number about the OLD PAIRING. Every candidate here starts
# with an unknown decode rate somewhere between 12.0 and 23.85, and the honest
# expectation is that it lands nearer the floor on exactly the prompts this swap
# was made for. Benchmark the pairing, not the model. Candidate 5 (cyber-lora)
# is the only entry that does not have this problem, because it does not change
# the target's weights at all.
