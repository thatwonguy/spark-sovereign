  huihui-awq-mtp:
    rank: 10
    hf_repo: shawnw3i/Huihui-Qwen3.8-27B-abliterated-AWQ-MTP
    format: awq-4bit
    upstream: huihui-ai/Huihui-Qwen3.8-27B-abliterated
    refusals_per_100:            # NOT PUBLISHED (inherits huihui's silence)
